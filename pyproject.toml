[project]
name = "preprocess-retina-datasets"
version = "0.0.1"
description = "A library and CLI to preprocess retina fundus image datasets into a uniform structure."
authors = [{ name = "Stefan Meier", email = "42180739+Meier-Stefan@users.noreply.github.com (open issues to contact me)" }]
readme = "README.md"
keywords = ['retina', 'fundus', 'image-processing', 'diabetic-retinopathy', 'preprocessing']
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pillow>=11.0.0",
    "numpy>=1.26.0",
    "opencv-contrib-python-headless>=4.8.0",
    "tqdm>=4.66.0",
]

[project.scripts]
crop-images = "preprocess_retina_datasets.cli.crop:main"
detect-saliency = "preprocess_retina_datasets.cli.saliency:main"
build-dataset-index = "preprocess_retina_datasets.cli.package:main"
prepare-ddr = "preprocess_retina_datasets.cli.ddr:main"

[project.urls]
Homepage = "https://diabetic-retinopathy-detection.github.io/preprocess-retina-datasets/"
Repository = "https://github.com/Diabetic-Retinopathy-Detection/preprocess-retina-datasets"
Documentation = "https://diabetic-retinopathy-detection.github.io/preprocess-retina-datasets/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "mypy>=1.19.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
    "types-tqdm>=4.67.3.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preprocess_retina_datasets"]
include = ["src/preprocess_retina_datasets/py.typed"]

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]
